name: Auth CI

on:
  push:
    branches: [main]
    paths:
      - 'auth/**'
  pull_request:
    branches: [main]
    paths:
      - 'auth/**'

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version: '1.25.0'
          cache-dependency-path: auth/go.sum
          
      - run: gofmt -l .

  test:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version: '1.25.0'
          cache-dependency-path: auth/go.sum

      - run: go mod download

      - run: go test ./... -v -race

  build:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version: '1.25.0'
          cache-dependency-path: auth/go.sum

      - run: go mod download

      - run: go build -v ./...

