services:
  auth:
    build:
      context: ./auth
    ports:
      - "8080:8080"
    environment:
      - PROTO=${PROTO:-http}
      - HOST=${HOST:-localhost}
      - PORT=${PORT:-:8080}
      - WEBAUTHN_NAME=${WEBAUTHN_NAME:-Gia Pha}
      - WEBAUTHN_ID=${WEBAUTHN_ID:-localhost}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-http://localhost:8081}
      - LOG_LEVEL=${LOG_LEVEL:-DEBUG}
    develop:
      watch:
        - action: rebuild
          path: ./auth

  auth-ui:
    build:
      context: ./auth-ui
    ports:
      - "8081:80"
    develop:
      watch:
        - action: sync
          path: ./auth-ui
          target: /usr/share/nginx/html

  prototype:
    build:
      context: ./prototype
    ports:
      - "8082:80"
    develop:
      watch:
        - action: sync
          path: ./prototype
          target: /usr/share/nginx/html

  frontend:
    build:
      context: ./frontend
    ports:
      - "8083:80"
    develop:
      watch:
        - action: rebuild
          path: ./frontend

  pact-broker:
    image: pactfoundation/pact-broker:latest
    ports:
      - "9292:9292"
    environment:
      PACT_BROKER_DATABASE_URL: postgres://pactbroker:pactbroker@pact-broker-db/pactbroker
      PACT_BROKER_PORT: 9292
      PACT_BROKER_LOG_LEVEL: INFO
      PACT_BROKER_ALLOW_MIGRATE: "true"
    depends_on:
      pact-broker-db:
        condition: service_healthy

  pact-broker-db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: pactbroker
      POSTGRES_USER: pactbroker
      POSTGRES_PASSWORD: pactbroker
    volumes:
      - pact-broker-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pactbroker -d pactbroker"]
      interval: 2s
      timeout: 5s
      retries: 10

volumes:
  pact-broker-db-data:
