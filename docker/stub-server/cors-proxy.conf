# CORS proxy in front of the pact stub server (see Dockerfile).
#
# pact-stub-server always sends Access-Control-Allow-Origin: * and never sends
# Access-Control-Allow-Credentials, so the browser refuses to read the responses
# of the login/register calls, which use credentials:'include' for the sid
# cookie. The handshake is terminated here instead.

# Only echo back local origins; this is a development-only service.
map $http_origin $cors_origin {
    default       "";
    ~^http://localhost(:[0-9]+)?$      $http_origin;
    ~^http://127\.0\.0\.1(:[0-9]+)?$   $http_origin;
}

server {
    listen 8090;

    location / {
        # Pre-flight: the stub server answers OPTIONS with 404.
        if ($request_method = 'OPTIONS') {
            add_header Access-Control-Allow-Origin      $cors_origin always;
            add_header Access-Control-Allow-Credentials true         always;
            add_header Access-Control-Allow-Methods    'GET, POST, PUT, DELETE, OPTIONS' always;
            add_header Access-Control-Allow-Headers    'Content-Type' always;
            add_header Access-Control-Max-Age          600           always;
            return 204;
        }

        proxy_pass http://127.0.0.1:8091;
        proxy_set_header Host $host;

        # the stub server sends this on every response, with or without its
        # -o/--cors flag; a response with two different Access-Control-Allow-Origin
        # values is rejected by the browser, so drop the wildcard.
        proxy_hide_header Access-Control-Allow-Origin;
        proxy_hide_header Access-Control-Allow-Credentials;

        add_header Access-Control-Allow-Origin      $cors_origin always;
        add_header Access-Control-Allow-Credentials true         always;
    }
}
